<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chapter thumbnail wall</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Chapter thumbnail wall</h1>
      <p class="hint">
        Pick a WebM/VP9 video with chapter markers. Each chapter contributes
        three candidate frames (near start, midpoint, near end); click a frame
        to choose the representative one, then export the manifest.
      </p>
      <div class="toolbar">
        <input type="file" accept="video/webm" data-role="file-input" />
        <label>
          Concurrency
          <select data-role="concurrency">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>
        <button type="button" data-role="cancel" disabled>Cancel</button>
        <button type="button" data-role="export" disabled>Export manifest</button>
      </div>
      <p class="status" data-role="status">No video loaded.</p>
      <div class="grid" data-role="grid"></div>
      <pre class="manifest-preview" data-role="manifest-preview" hidden></pre>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
