<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC 接收端卡顿归因监控</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>WebRTC 接收端卡顿归因监控</h1>
    <p class="subtitle">基于 getStats 区分：网络丢包 / 解码耗时 / 抖动缓冲 / 渲染等待</p>
  </header>

  <section class="controls">
    <fieldset>
      <legend>数据源</legend>
      <label><input type="radio" name="source" value="sim" checked /> 模拟数据</label>
      <label><input type="radio" name="source" value="rtc" /> 真实 WebRTC loopback</label>
      <button id="btn-start">开始采集</button>
      <button id="btn-stop" disabled>停止</button>
    </fieldset>
    <fieldset>
      <legend>故障注入</legend>
      <button id="btn-bandwidth" disabled>模拟带宽下降 (20s)</button>
      <button id="btn-block" disabled>模拟主线程阻塞 (20s)</button>
    </fieldset>
    <div id="alert-banner" class="alert hidden"></div>
  </section>

  <section class="verdict">
    <h2>场景首升指标</h2>
    <table id="verdict-table">
      <thead>
        <tr><th>场景</th><th>最先升高的指标</th><th>卡顿发生时间</th><th>状态</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="chart-wrap">
    <h2>四类指标时间对齐视图</h2>
    <canvas id="chart" width="1100" height="560"></canvas>
    <div id="chart-tip" class="tip hidden"></div>
  </section>

  <section class="evidence">
    <h2>卡顿证据窗口（自动截取卡顿点前后 10 秒）</h2>
    <div id="evidence-empty">暂无卡顿事件</div>
    <div id="evidence-panel" class="hidden">
      <div id="evidence-meta"></div>
      <canvas id="evidence-chart" width="1100" height="360"></canvas>
    </div>
  </section>

  <section class="history">
    <h2>历史异常区间（恢复后保留）</h2>
    <table id="history-table">
      <thead>
        <tr><th>#</th><th>开始</th><th>结束</th><th>时长</th><th>归因（首升指标）</th><th>证据</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
